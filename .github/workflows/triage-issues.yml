name: Triage Issues

on:
  workflow_dispatch:

jobs:
  check-issue:
    runs-on: ubuntu-latest
    outputs:
      issue_open: ${{ steps.check_issue.outputs.issue_open }}
    steps:
      - name: Check if Issue No. 1 exists and is open
        id: check_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch issue #1 and check its state
          issue_state=$(gh issue view 1 --json state --jq '.state' 2>/dev/null || echo "NOT_FOUND")

          if [ "$issue_state" = "OPEN" ]; then
            echo "Issue #1 exists and is open"
            echo "issue_exists=true" >> $GITHUB_OUTPUT
            echo "issue_open=true" >> $GITHUB_OUTPUT
          elif [ "$issue_state" = "CLOSED" ]; then
            echo "Issue #1 exists but is closed"
            echo "issue_exists=true" >> $GITHUB_OUTPUT
            echo "issue_open=false" >> $GITHUB_OUTPUT
          else
            echo "Issue #1 does not exist"
            exit 1
          fi

  call-workflow:
    needs: check-issue
    if: ${{ needs.check-issue.outputs.issue_open == 'true' }}
    uses: demo-42/.github/.github/workflows/reusable-triage-issues.yml@main
    with:
      issue_number: 1
