name: Triage Issues

on:
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
        type: number

permissions:
  issues: write

jobs:
  check-issue:
    runs-on: ubuntu-latest
    outputs:
      issue_open: ${{ steps.check_issue.outputs.issue_open }}
    steps:
      - uses: actions/checkout@v4
      - name: Check if Issue exists and is open
        id: check_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NO: ${{ inputs.issue_number }}
        run: |
          # Fetch issue and check its state
          issue_state=$(gh issue view $ISSUE_NO --json state --jq '.state' 2>/dev/null || echo "NOT_FOUND")

          if [ "$issue_state" = "OPEN" ]; then
            echo "Issue #$ISSUE_NO exists and is open"
            echo "issue_exists=true" >> $GITHUB_OUTPUT
            echo "issue_open=true" >> $GITHUB_OUTPUT
          elif [ "$issue_state" = "CLOSED" ]; then
            echo "Issue #$ISSUE_NO exists but is closed"
            echo "issue_exists=true" >> $GITHUB_OUTPUT
            echo "issue_open=false" >> $GITHUB_OUTPUT
          else
            echo "Issue #$ISSUE_NO does not exist"
            exit 1
          fi

  call-workflow:
    needs: check-issue
    if: ${{ needs.check-issue.outputs.issue_open == 'true' }}
    uses: demo-42/.github/.github/workflows/reusable-triage-issues.yml@main
    with:
      issue_number: ${{ inputs.issue_number }}
